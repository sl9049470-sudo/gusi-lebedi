<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо — Гуси-Лебеди</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a8fc7 100%);
            padding: 20px;
            color: #fff;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 640px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            animation: fadeUp 1s ease-out;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 64px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }

        h1 {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
        }

        .divider {
            width: 80px;
            height: 3px;
            background: #ffd166;
            margin: 0 auto 24px;
            border-radius: 3px;
        }

        p {
            font-size: 17px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.92);
            margin-bottom: 14px;
        }

        .brand {
            font-weight: 700;
            color: #ffd166;
        }

        .footer {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 24px; }
            h1 { font-size: 26px; }
            .logo { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🦢🦢</div>

        <h1>Спасибо!</h1>
        <div class="divider"></div>

        <p>Благодарим вас за переход по тестовому креативному коду.</p>
        <p>
            <span class="brand">«Гуси-Лебеди»</span> — туристическое агентство,
            работающее с пакетными турами.
        </p>
        <p>Документ разработан как рабочая концепция.</p>

        <div class="footer">© Гуси-Лебеди · Туристическое агентство</div>
    </div>
</body>
</html>
